<div class="row">
    <div class="col-lg-12">
        <div class="panel panel-info">
            <div class="panel-heading">
                Requerimientos
            </div>
            <div class="panel-body">
                <div class="row">
                    <div class="col-lg-12">
                        <table id="example" class="table table-striped table-bordered" cellspacing="0" width="100%">
                            <thead>
                            <tr>
                                <th class="text-center">CODIGO</th>
                                <th class="text-center">OFICINA SOLICITA</th>
                                <th class="text-center">FEC_OPER.</th>
                            </tr>
                            </thead>
                            <tbody>
                            {% for requirement in requerimientos %}
                            <tr>
                                <td>{{ requirement.code }}</td>
                                <td>{{ requirement.office.name }}</td>
                                <td>{{ requirement.created|date:"d/m/y" }}</td>
                            </tr>
                            {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="row">
                    <input type="hidden" name="requirement" id="requirement">
                </div>
            </div>
        </div>
    </div>
</div>

{% block js %}
<script>
$(document).ready(function() 
{
	var table = $('#example').dataTable( {
        "language": {
        	url: "/static/localizacion/es_ES.json"
        }
    } );
 
    $('#example tbody').on( 'click', 'tr', function() 
    {
    	if ($(this).hasClass('selected') ) 
        {        	
        	$(this).removeClass('selected');
            
        }
        else 
        {
	        table.$('tr.selected').removeClass('selected');
	        $(this).addClass('selected');
	        var requirement = $(this).find('td.sorting_1').text();
	        $('#requirement').val(requirement);	         
        }
    }); 
    
});

</script>
{% endblock js %}
