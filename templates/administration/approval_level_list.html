{% extends "administration/base_administration.html" %}
{% block cuerpo %}
<h1 class="page-title mb-3">Niveles de Aprobacion</h1>
<div class="row">
    <div class="col-lg-10">
        {% if perms.administration.add_approvallevel %}
        <a href="{% url 'administration:approval_level_create' %}" class="btn btn-primary">
            Crear
        </a>
        {% endif %}
    </div>
    <div class="col-lg-2 text-end">
        <div class="btn-group">

        </div>
    </div>
</div>
<hr/>
<div class="row">
    <div class="col-lg-4">
        <form id="list-search" class="d-flex flex-wrap align-items-center gap-2"
              hx-get="{{ request.path }}" hx-target="#list-results"
              hx-trigger="submit, keyup from:input changed delay:300ms">
            <div class="input-group">
                <input type="text" name="q" class="form-control"
                       placeholder="Buscar por descripción"
                       value="{{ request.GET.q|default:'' }}">
                <span class="input-group-text p-0 border-0">
                    <button class="btn btn-outline-secondary" type="submit">
                        <span class="bi bi-search"></span>
                    </button>
                </span>
            </div>
        </form>
    </div>
</div>
<br/>
<div id="list-results">
    {% include "administration/includes/approval_level_rows.html" %}
</div>
{% endblock cuerpo %}
