{% extends "warehouse/base_warehouse.html" %}
{% block cuerpo %}
<h3>Movimientos</h3>
<div class="row">
    <div class="col-lg-10">

    </div>
    <div class="col-lg-2 text-right">
        <div class="btn-group">
            {% if perms.warehouse.ver_reporte_movimientos_excel %}
            <button class="btn btn-default" type="button"
                    onclick="location.href='{% url 'warehouse:movement_report' %}';">
                <span class="glyphicon glyphicon-list-alt"></span>
            </button>
            {% endif %}
        </div>
    </div>
</div>
<hr/>
<div class="row">
    <div class="col-lg-4">
        <form id="list-search" class="form-inline"
              hx-get="{{ request.path }}" hx-target="#list-results"
              hx-trigger="submit, keyup from:input changed delay:300ms">
            <div class="input-group">
                <input type="text" name="q" class="form-control"
                       placeholder="Buscar por movimiento, tipo o almacén"
                       value="{{ request.GET.q|default:'' }}">
                <span class="input-group-btn">
                    <button class="btn btn-default" type="submit">
                        <span class="glyphicon glyphicon-search"></span>
                    </button>
                </span>
            </div>
        </form>
    </div>
</div>
<br/>
<div id="list-results">
    {% include "warehouse/includes/movement_rows.html" %}
</div>
{% endblock cuerpo %}
