<div class="card">
    <div class="card-header d-flex align-items-center gap-2">
        <i class="bi bi-bell"></i>
        <span>Panel de notificaciones</span>
        <span class="badge text-bg-secondary ms-auto">{{ notifications|length }}</span>
    </div>
    <div class="list-group list-group-flush">
        {% for notification in notifications %}
        <div class="list-group-item d-flex align-items-start gap-2">
            <i class="bi bi-exclamation-circle text-warning mt-1" aria-hidden="true"></i>
            <span>{{ notification }}</span>
        </div>
        {% empty %}
        <div class="list-group-item d-flex align-items-center gap-2 text-muted">
            <i class="bi bi-check-circle text-success" aria-hidden="true"></i>
            <span>Sin pendientes.</span>
        </div>
        {% endfor %}
    </div>
</div>
