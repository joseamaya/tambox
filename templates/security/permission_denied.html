{% extends "security/base_security.html" %}
{% block cuerpo %}
<h1 class="page-title mb-3">Permiso denegado</h1>
<div class="card">
    <div class="card-body text-center py-5">
        <i class="bi bi-shield-lock display-4 text-secondary" aria-hidden="true"></i>
        <h2 class="h5 mt-3 mb-1">No tienes permisos para acceder a esta opción</h2>
        <p class="text-muted mb-4">Si crees que es un error, contacta al administrador del sistema.</p>
        <a class="btn btn-primary" href="{% url 'security:home' %}">
            <i class="bi bi-house"></i> Volver al inicio
        </a>
    </div>
</div>
{% endblock cuerpo %}
