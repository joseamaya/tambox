<div class="row">
    <div class="col-lg-12">
        <div class="panel panel-info">
            <div class="panel-heading">
                Ordenes de Servicios
            </div>
            <div class="panel-body">

                <div class="row">
                    <div class="col-lg-12">
                        <table id="example" class="table table-striped table-bordered" cellspacing="0" width="100%">
                            <thead>
                            <tr>
                                <th>CODIGO</th>
                                <th>PROVEEDOR</th>
                                <th>FECHA</th>
                            </tr>
                            </thead>
                            <tfoot>
                            <tr>
                                <th>CODIGO</th>
                                <th>PROVEEDOR</th>
                                <th>FECHA</th>
                            </tr>
                            </tfoot>
                            <tbody>
                            {% for order in orders %}
                            <tr>
                                <td>{{ order.code }}</td>
                                {% if order.quotation %}
                                <td>{{ order.quotation.supplier }}</td>
                                {% else %}
                                <td>{{ order.supplier }}</td>
                                {% endif %}
                                <td>{{ order.date }}</td>
                            </tr>
                            {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="row">
                    <input type="hidden" name="service_order" id="id_service_order">
                </div>
            </div>
        </div>
    </div>
</div>

{% block js %}
<script>
$(document).ready(function() 
{
	var table = $('#example').dataTable( {
        "language": {
        	url: "/static/localizacion/es_ES.json"
        }
    } );
 
    $('#example tbody').on( 'click', 'tr', function() 
    {
    	if ($(this).hasClass('selected') ) 
        {        	
        	$(this).removeClass('selected');
            
        }
        else 
        {
	        table.$('tr.selected').removeClass('selected');
	        $(this).addClass('selected');
	        var service_order = $(this).find('td.sorting_1').text();
	        $('#id_service_order').val(service_order);           
        }
    }); 
    
});

</script>
{% endblock js %}
