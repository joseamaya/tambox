{% extends "purchases/base_purchases.html" %}
{% block cuerpo %}
<h3>Órdenes / Reporte Fechas</h3>
<form role="form" method="post">
    {% csrf_token %}
    <div class="row">
        <div class="col-lg-10">
            <input type="submit" class="btn btn-primary" name="submit" value="Generar">
        </div>
    </div>
    <hr/>
    <div class="row">
        <div class="col-lg-12">
            <div class="panel panel-default">
                <div class="panel-body">
                    <div class="form-group">
                        {{ form.as_p }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
{% endblock cuerpo %}
{% block js %}
<script>
$("input[name=search_type]").change(function () 
{	 
	if($(this).val()=='F')
	{
		$("#id_start_date").attr("disabled",false);
		$("#id_end_date").attr("disabled",false);
		$("#id_month").attr("disabled",true);
		$("#id_year").attr("disabled",true);
	}
	else if($(this).val()=='M')
	{
		$("#id_start_date").attr("disabled",true);
		$("#id_end_date").attr("disabled",true);
		$("#id_month").attr("disabled",false);
		$("#id_year").attr("disabled",false);	
	}
	else if($(this).val()=='A')
	{
		$("#id_start_date").attr("disabled",true);
		$("#id_end_date").attr("disabled",true);
		$("#id_month").attr("disabled",true);
		$("#id_year").attr("disabled",false);	
	}
});	 


</script>
{% endblock js %}
