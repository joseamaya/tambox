{% extends "purchases/base_purchases.html" %}
{% block cuerpo %}
<h1 class="page-title mb-3">Órdenes / Reporte Fechas</h1>
<form role="form" method="post">
    {% csrf_token %}
    <div class="row">
        <div class="col-lg-10">
            <input type="submit" class="btn btn-primary" name="submit" value="Generar">
        </div>
    </div>
    <hr/>
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
{% endblock cuerpo %}
{% block js %}
<script>
document.querySelectorAll("input[name=search_type]").forEach(function (radio) {
    radio.addEventListener('change', function () {
        var value = this.value;
        document.getElementById('id_start_date').disabled = value !== 'F';
        document.getElementById('id_end_date').disabled = value !== 'F';
        document.getElementById('id_month').disabled = value !== 'M';
        document.getElementById('id_year').disabled = value === 'F';
    });
});
</script>
{% endblock js %}
