<div class="row">
    <div class="col-lg-12">
        <div class="panel panel-info">
            <div class="panel-heading">
                Cotizaciones
            </div>
            <div class="panel-body">
                <div class="row">
                    <div class="col-lg-12">
                        <table id="example" class="table table-striped table-bordered" cellspacing="0" width="100%">
                            <thead>
                            <tr>
                                <th>CODIGO</th>
                                <th>REQUERIMIENTO</th>
                                <th>PROVEEDOR</th>
                                <th>FECHA</th>
                            </tr>
                            </thead>
                            <tbody>
                            {% for quotation in quotations %}
                            <tr>
                                <td>{{ quotation.code }}</td>
                                <td>{{ quotation.requirement }}</td>
                                <td>{{ quotation.supplier }}</td>
                                <td>{{ quotation.date|date:"d/m/Y" }}</td>
                            </tr>
                            {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="row">
                    <input type="hidden" name="quotation" id="quotation">
                </div>
            </div>
        </div>
    </div>
</div>

{% block js %}
<script>
    $('#example tbody').on('click', 'tr', function () {
        var row = $(this);
        var already = row.hasClass('selected');
        $('#example tbody tr').removeClass('selected');
        if (already) {
            $('#quotation').val('');
        } else {
            row.addClass('selected');
            $('#quotation').val(row.find('td:first').text());
        }
    });
</script>
{% endblock js %}
