<div class="row">
    <div class="col-lg-12">
        <div class="card border-info">
            <div class="card-header">
                Cotizaciones
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-lg-12">
                        <table id="example" class="table table-striped table-bordered" cellspacing="0" width="100%">
                            <thead>
                            <tr>
                                <th>CODIGO</th>
                                <th>REQUERIMIENTO</th>
                                <th>PROVEEDOR</th>
                                <th>FECHA</th>
                            </tr>
                            </thead>
                            <tbody>
                            {% for quotation in quotations %}
                            <tr>
                                <td>{{ quotation.code }}</td>
                                <td>{{ quotation.requirement }}</td>
                                <td>{{ quotation.supplier }}</td>
                                <td>{{ quotation.date|date:"d/m/Y" }}</td>
                            </tr>
                            {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="row">
                    <input type="hidden" name="quotation" id="quotation">
                </div>
            </div>
        </div>
    </div>
</div>

{% block js %}
<script>initTransferTable('quotation');</script>
{% endblock js %}
