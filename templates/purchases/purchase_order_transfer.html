<div class="row">
    <div class="col-lg-12">
        <div class="panel panel-info">
            <div class="panel-heading">
                Ordenes de Compra
            </div>
            <div class="panel-body">
                <div class="row">
                    <div class="col-lg-12">
                        <table id="example" class="table table-striped table-bordered" cellspacing="0" width="100%">
                            <thead>
                            <tr>
                                <th>CODIGO</th>
                                <th>PROVEEDOR</th>
                                <th>FECHA</th>
                            </tr>
                            </thead>
                            <tbody>
                            {% for order in orders %}
                            <tr>
                                <td>{{ order.code }}</td>
                                {% if order.quotation %}
                                <td>{{ order.quotation.supplier }}</td>
                                {% else %}
                                <td>{{ order.supplier }}</td>
                                {% endif %}
                                <td>{{ order.date|date:"d/m/Y" }}</td>
                            </tr>
                            {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="row">
                    <input type="hidden" name="purchase_order" id="purchase_order">
                </div>
            </div>
        </div>
    </div>
</div>

{% block js %}
<script>
    $('#example tbody').on('click', 'tr', function () {
        var row = $(this);
        var already = row.hasClass('selected');
        $('#example tbody tr').removeClass('selected');
        if (already) {
            $('#purchase_order').val('');
        } else {
            row.addClass('selected');
            $('#purchase_order').val(row.find('td:first').text());
        }
    });
</script>
{% endblock js %}
