<div class="row">
    <div class="col-lg-12">
        <div class="panel panel-info">
            <div class="panel-heading">
                Requerimientos
            </div>
            <div class="panel-body">
                <div class="row">
                    <div class="col-lg-12">
                        <table id="example" class="table table-striped table-bordered" cellspacing="0" width="100%">
                            <thead>
                            <tr>
                                <th class="text-center">CODIGO</th>
                                <th class="text-center">OFICINA SOLICITA</th>
                                <th class="text-center">FEC_OPER.</th>
                            </tr>
                            </thead>
                            <tbody>
                            {% for requirement in requirements %}
                            <tr>
                                <td>{{ requirement.code }}</td>
                                <td>{{ requirement.office.name }}</td>
                                <td>{{ requirement.created|date:"d/m/y" }}</td>
                            </tr>
                            {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="row">
                    <input type="hidden" name="requirement" id="requirement">
                </div>
            </div>
        </div>
    </div>
</div>

{% block js %}
<script>
    $('#example tbody').on('click', 'tr', function () {
        var row = $(this);
        var already = row.hasClass('selected');
        $('#example tbody tr').removeClass('selected');
        if (already) {
            $('#requirement').val('');
        } else {
            row.addClass('selected');
            $('#requirement').val(row.find('td:first').text());
        }
    });
</script>
{% endblock js %}
