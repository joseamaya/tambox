{% extends "requirements/base_requirements.html" %}
{% block cuerpo %}
<div class="row">
    <div class="col-lg-12">
        <h1 class="pb-2 mb-3 border-bottom">Operaciones</h1>
    </div>
</div>
<div class="row">
    <div class="col-lg-12">
        <div class="card border-info">
            <div class="card-header">
                Aprobación de Requerimientos
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-lg-4">
                        <form id="list-search" class="d-flex flex-wrap align-items-center gap-2"
                              hx-get="{{ request.path }}" hx-target="#list-results"
                              hx-trigger="submit, keyup from:input changed delay:300ms">
                            <div class="input-group">
                                <input type="text" name="q" class="form-control"
                                       placeholder="Buscar por requerimiento"
                                       value="{{ request.GET.q|default:'' }}">
                                <span class="input-group-text p-0 border-0">
                                    <button class="btn btn-secondary" type="submit">
                                        <span class="bi bi-search"></span>
                                    </button>
                                </span>
                            </div>
                        </form>
                    </div>
                </div>
                <br/>
                <div id="list-results">
                    {% include "requirements/includes/requirement_approval_rows.html" %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock cuerpo %}
