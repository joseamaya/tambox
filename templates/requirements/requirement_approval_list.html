{% extends "requirements/base_requirements.html" %}
{% block cuerpo %}
<div class="row">
    <div class="col-lg-12">
        <h1 class="page-header">Operaciones</h1>
    </div>
</div>
<div class="row">
    <div class="col-lg-12">
        <div class="panel panel-info">
            <div class="panel-heading">
                Aprobación de Requerimientos
            </div>
            <div class="panel-body">
                <div class="row">
                    <div class="col-lg-4">
                        <form id="list-search" class="form-inline"
                              hx-get="{{ request.path }}" hx-target="#list-results"
                              hx-trigger="submit, keyup from:input changed delay:300ms">
                            <div class="input-group">
                                <input type="text" name="q" class="form-control"
                                       placeholder="Buscar por requerimiento"
                                       value="{{ request.GET.q|default:'' }}">
                                <span class="input-group-btn">
                                    <button class="btn btn-default" type="submit">
                                        <span class="glyphicon glyphicon-search"></span>
                                    </button>
                                </span>
                            </div>
                        </form>
                    </div>
                </div>
                <br/>
                <div id="list-results">
                    {% include "requirements/includes/requirement_approval_rows.html" %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock cuerpo %}
