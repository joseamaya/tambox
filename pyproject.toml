[tool.ruff]
target-version = "py312"
exclude = ["**/migrations/**", ".commandcode"]

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# Los settings heredan de `base.py` con `import *`, el patron habitual del split
# de settings de Django.
"tambox/settings/*.py" = ["F403", "F405"]
